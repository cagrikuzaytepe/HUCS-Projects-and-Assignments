syntax = "proto3";

package proto;
option go_package = "grpc-kvstore/proto";


service KVStore {


  rpc Put(KeyValue) returns (Ack);

  rpc Get(Key) returns (Value);

  rpc List(Empty) returns (stream KeyValue);


  rpc Replicate(KeyValue) returns (Ack);
}


message KeyValue {
  string key = 1;
  string value = 2;
}

message Key {
  string key = 1;
}

message Value {
  string value = 1;
}

message Ack {
  string message = 1;
}

message Empty {}